# coturn da ponte grátis (docs/spec/sala-pelo-nostr.md): a mesma configuração do servidor-internet/vps/turnserver.conf,
# com travas de banda para a voz passar e o vídeo não, e um teto total abaixo dos 10 TB/mês grátis da Oracle.
# Troque IP_PUBLICO, IP_PRIVADO e SEGREDO_DO_TURN (o mesmo TURN_SECRET do emissor).

listening-port=3479
# A VM da Oracle só vê o IP privado; o público chega por NAT 1:1. Sem isto, o TURN anuncia o endereço errado
external-ip=IP_PUBLICO/IP_PRIVADO
realm=nebula
use-auth-secret
static-auth-secret=SEGREDO_DO_TURN
fingerprint

min-port=49160
max-port=49999

no-tls
no-dtls
no-cli
no-multicast-peers
# Só relay de UDP (o que o WebRTC usa). Sem isto, quem pega um acesso pode usar a ponte como proxy TCP (RFC 6062)
no-tcp-relay

# Nada de rede interna: quem pega um acesso não alcança a rede da VPS nem endereços privados
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

user-quota=40
total-quota=400

# Bytes por segundo por sessão, em cada sentido: ~320 kbps. A voz cabe (Opus estéreo até 192 kbps + cabeçalhos);
# vídeo não. No servidor-internet é 6000000 (48 Mbps), porque lá a tela passa pela ponte
max-bps=40000
# Bytes por segundo somando todas as sessões, em cada sentido: ~24 Mbps. No pior caso, ~7,8 TB de saída por mês
bps-capacity=3000000

simple-log
log-file=/var/log/turnserver/turnserver.log
